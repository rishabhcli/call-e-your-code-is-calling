name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure warning-free Git initialization
        run: git config --global init.defaultBranch main

      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          # setup-node's automatic package-manager cache runs before the next
          # step activates the repository-pinned pnpm binary.
          package-manager-cache: false

      - name: Activate exact pnpm
        run: |
          node scripts/run-with-warning-gate.mjs -- corepack enable
          node scripts/run-with-warning-gate.mjs -- corepack prepare pnpm@11.20.0 --activate

      - name: Install locked dependencies
        run: node scripts/run-with-warning-gate.mjs -- pnpm bootstrap

      - name: Install pinned Chromium runtime
        run: node scripts/run-with-warning-gate.mjs -- node scripts/playwright-cli.mjs install --with-deps chromium

      - name: Restore isolated Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/operator/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml', 'apps/operator/**') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Verify all gates
        env:
          CI: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm verify-all

      - name: Write allowlisted CI evidence
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/finalize-ci-evidence.mjs .dev/logs/verify-summary.json .dev/logs/ci-evidence.json

      - name: Upload allowlisted CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-all-${{ github.sha }}
          path: .dev/logs/ci-evidence.json
          if-no-files-found: error
          retention-days: 14
