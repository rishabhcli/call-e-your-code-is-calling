packages:
  - apps/*
  - packages/*

strictPeerDependencies: true
saveExact: true
engineStrict: true
resolutionMode: highest
cacheDir: .dev/cache/pnpm-cache
stateDir: .dev/cache/pnpm-state
storeDir: .dev/cache/pnpm-store
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
blockExoticSubdeps: true
minimumReleaseAgeExclude:
  # Version-specific direct/toolchain exclusions reviewed 2026-08-09 from primary release metadata.
  - '@next/env@16.3.0'
  - '@next/swc-darwin-arm64@16.3.0'
  - '@next/swc-darwin-x64@16.3.0'
  - '@next/swc-linux-arm64-gnu@16.3.0'
  - '@next/swc-linux-arm64-musl@16.3.0'
  - '@next/swc-linux-x64-gnu@16.3.0'
  - '@next/swc-linux-x64-musl@16.3.0'
  - '@next/swc-win32-arm64-msvc@16.3.0'
  - '@next/swc-win32-x64-msvc@16.3.0'
  - '@types/pg@8.21.0'
  - '@typescript-eslint/eslint-plugin@8.66.0'
  - '@typescript-eslint/parser@8.66.0'
  - '@typescript-eslint/project-service@8.66.0'
  - '@typescript-eslint/scope-manager@8.66.0'
  - '@typescript-eslint/tsconfig-utils@8.66.0'
  - '@typescript-eslint/type-utils@8.66.0'
  - '@typescript-eslint/types@8.66.0'
  - '@typescript-eslint/typescript-estree@8.66.0'
  - '@typescript-eslint/utils@8.66.0'
  - '@typescript-eslint/visitor-keys@8.66.0'
  - eslint@10.8.1
  - next@16.3.0
  - nanoid@3.3.17
  - tsx@4.23.12
  - typescript-eslint@8.66.0
overrides:
  # GHSA-2v37-7h3g-55p8: patched floor for transitive PostCSS consumers.
  'nanoid@3.3.16': 3.3.17
allowBuilds:
  # Reviewed 2026-08-09: required only by pinned tsx development tooling.
  esbuild: true
